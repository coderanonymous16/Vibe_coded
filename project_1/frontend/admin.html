<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExamRAG | Admin</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="brand">ExamRAG Admin</div>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="chat.html">Chat</a>
          <a href="login.html" class="button-link" id="logoutButton">Logout</a>
        </nav>
      </header>

      <div class="page-header">
        <h2>Document operations</h2>
        <button class="primary-btn" type="button">Upload PDF</button>
      </div>

      <div class="admin-grid" id="adminGrid"></div>
    </div>

    <script src="config.js"></script>
    <script>
      const API_BASE = window.EXAMRAG_API_BASE || 'http://127.0.0.1:8000/api/v1';
      const adminGrid = document.getElementById('adminGrid');
      const logoutButton = document.getElementById('logoutButton');

      logoutButton.addEventListener('click', function (event) {
        event.preventDefault();
        localStorage.removeItem('examrag_token');
        localStorage.removeItem('examrag_email');
        window.location.href = 'login.html';
      });

      async function loadDocuments() {
        try {
          const response = await fetch(`${API_BASE}/documents`);
          const data = await response.json();
          const documents = data.documents || [];

          adminGrid.innerHTML = '';
          documents.forEach((doc) => {
            const card = document.createElement('div');
            card.className = 'card admin-card';
            card.innerHTML = `
              <div class="small-label">${doc.subject || 'READY'}</div>
              <h3>${doc.title}</h3>
              <p>${doc.university || 'AKTU'} · ${doc.course || 'B.Tech CSE'} · Semester ${doc.semester || 'N/A'} · Subject: ${doc.subject || 'N/A'}</p>
            `;
            adminGrid.appendChild(card);
          });
        } catch (error) {
          adminGrid.innerHTML = '<div class="card admin-card"><h3>Unable to load documents</h3><p>Check backend connection.</p></div>';
        }
      }

      loadDocuments();
    </script>
  </body>
</html>
