<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExamRAG | Register</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="brand">ExamRAG</div>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="chat.html">Chat</a>
        </nav>
      </header>

      <div class="card form-shell">
        <h2>Create your account</h2>
        <form id="registerForm">
          <label>
            Full name
            <input id="fullName" type="text" placeholder="Student name" required />
          </label>
          <label>
            Email
            <input id="email" type="email" placeholder="you@example.com" required />
          </label>
          <label>
            Password
            <input id="password" type="password" placeholder="Choose a password" required />
          </label>
          <button type="submit" class="primary-btn">Register</button>
        </form>
        <p id="statusText"></p>
        <p>Already registered? <a href="login.html">Login here</a></p>
      </div>
    </div>

    <script src="config.js"></script>
    <script>
      const API_BASE = window.EXAMRAG_API_BASE || 'http://127.0.0.1:8000/api/v1';
      const registerForm = document.getElementById('registerForm');
      const statusText = document.getElementById('statusText');

      registerForm.addEventListener('submit', async function (event) {
        event.preventDefault();
        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        statusText.textContent = 'Creating account...';
        try {
          const response = await fetch(`${API_BASE}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ full_name: fullName, email, password })
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || 'Registration failed');
          }

          localStorage.setItem('examrag_token', data.access_token);
          localStorage.setItem('examrag_email', email);
          statusText.textContent = 'Account created. Redirecting...';
          window.location.href = 'chat.html';
        } catch (error) {
          statusText.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
